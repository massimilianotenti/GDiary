/* Stile condiviso. Le regole precedenti definiscono soltanto le disposizioni delle viste. */
:root{
 --font-ui:'Segoe UI',system-ui,sans-serif;
 --ink:var(--paint-172032);--muted:var(--paint-788493);--line:var(--paint-e0e5ed);--surface:var(--paint-fff);--sidebar:var(--paint-f5f6f8);
 --accent:var(--paint-f5b42c);--accent-hover:var(--paint-efaa1d);--accent-soft:var(--paint-fff3dc);--link:var(--paint-2679d5);
 --radius:7px;--text:15px;--title:30px;--section:22px;--card-title:18px;--small:13px;
 --space:8px;
 font-family:var(--font-ui);color:var(--ink);font-size:var(--text);background:var(--surface);
}
body{font-family:var(--font-ui);color:var(--ink)}
button,input,select,textarea{font-family:var(--font-ui);font-size:14px;border-color:var(--line);border-radius:var(--radius);color:var(--ink)}
button{padding:9px 13px;line-height:1.35}button:hover{background:var(--accent-soft)}
button.primary,.primary{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:600}
button.primary:hover{background:var(--accent-hover)}
input,select,textarea{background:var(--surface);padding:10px 12px;line-height:1.5}
textarea{font-size:var(--text);min-height:110px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--link);outline-offset:3px}
h1,.journal-view .journal-header h1{font-size:var(--title);font-weight:700;letter-spacing:-.7px;line-height:1.2;margin:0 0 8px}
h2,.journal-view #detail h2,.journal-view .dayhead button,body:has(.habit-actions) #detail h2{font-size:var(--section);font-weight:650;letter-spacing:-.35px;line-height:1.3}
h3,.journal-view .detail-title,.detail-title{font-size:var(--card-title);font-weight:650;line-height:1.4}
label{font-size:14px;font-weight:600;color:var(--ink);margin:16px 0 7px}
#detail form>label,.journal-view #detail form>label,body:has(.habit-actions) #detail label{font-size:var(--card-title);font-weight:600}
p{line-height:1.55}.muted,.hint,.excerpt{color:var(--muted)}.hint,.muted{font-size:var(--small)}

.sidebar,.journal-view .sidebar{background:var(--sidebar);padding:26px 16px;border-color:var(--line)}
.brand,.journal-view .brand{font-size:27px;letter-spacing:-.8px;margin:0 12px 26px}

.workspace,.journal-view .workspace{padding:26px 32px}

.excerpt,.journal-view .excerpt{font-size:14px;line-height:1.55}

const viewCache=new Map(),previewCache=new Map(),timings=[],PERFORMANCE_TRACING_KEY='gdiary.performanceTracing';let navigationEpoch=0,localSearchGeneration=0,commonReadAt=0,forceCommon=false,previewTimer,commonFlight=null,commonScope=null,commonWriteRevision=0,catalogReadAt=0,commonGeneration=0;const $=id=>document.getElementById(id);const chromeBar=document.querySelector('.topbar'),chromeMessage=$('message'),chromeWorkspace=document.querySelector('.workspace');function resetJournalChrome(){chromeWorkspace.prepend(chromeMessage);chromeWorkspace.prepend(chromeBar);chromeBar.append($('search'),$('refresh'));if(typeof captureToggle!=='undefined')chromeBar.append(captureToggle);document.querySelectorAll('.journal-status').forEach(n=>n.remove());}

function newTraceId(){return typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'trace-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);}
const node=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;};
const button=(text,fn,cls)=>{const b=node('button',text,cls);b.type='button';b.onclick=fn;return b;};
function dateAdd(date,n){const d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function monday(date){const d=new Date(date+'T12:00:00Z');return dateAdd(date,-((d.getUTCDay()+6)%7));}
let privacyShown=false,privacyLastActivity=Date.now();const privacyEditing=new Set();
// Reserved for the verified/consented local-storage integration. Tests inject
// a synthetic cache; production keeps this null and does not open IndexedDB.
let commonViewCache=null;
function privateTags(){return state.settings?.privateTags||['privato'];}
function privateEntry(e){return !!e&&entryTags(e).map(t=>t.trim().replace(/^#/,'').toLowerCase().normalize('NFC').replace(/\s+/g,'-')).some(t=>privateTags().includes(t));}
function privacyVisible(e){return privacyShown||!privateEntry(e);}
function privacyEntries(rows=state.entries){return rows.filter(privacyVisible);}
function privacyBlockVisible(b){return privacyVisible(b)||(privacyEditing.has(b.clientId)&&b.dirty);}
function privacyDetailPrivate(){const e=state.entries.find(e=>e.id===entryId);const label=[...$('detail').querySelectorAll('label')].find(l=>l.textContent==='Tag (separati da virgola)');return privateEntry(e)||privateEntry({tags:label?$(label.htmlFor)?.value||'':''});}
function privacyMask(){document.body.classList.toggle('private-notes-hidden',!privacyShown);document.querySelectorAll('.entry[data-id]').forEach(n=>n.hidden=!privacyShown&&privateEntry(state.entries.find(e=>e.id===n.dataset.id)));document.querySelectorAll('.continuous-block[data-client-id]').forEach(n=>{const b=continuousSession?.blocks.find(b=>b.clientId===n.dataset.clientId);n.hidden=!!b&&!privacyBlockVisible(b);});$('detail').hidden=!privacyShown&&privacyDetailPrivate();if($('detail').hidden)$('layout').classList.add('solo');const capturePrivate=privateEntry({tags:$('captureTags').value});if(capturePrivate&&!privacyShown)$('capturePanel').open=false;document.querySelectorAll('.doc-queue-item[data-private=true]').forEach(n=>n.hidden=!privacyShown);const button=$('privacyToggle');if(button){button.textContent=privacyShown?'Nascondi private':'Mostra private';button.setAttribute('aria-pressed',String(privacyShown));}const quick=$('privateQuick');if(quick)quick.hidden=view!=='journal'||!continuousMode;}
function setPrivacyShown(show){localSearchGeneration++;privacyShown=show;privacyLastActivity=Date.now();if(!show){privacyEditing.clear();query='';$('search').value='';archiveQuery='';document.querySelectorAll('dialog[open]').forEach(d=>d.close());message('Note private nascoste.');}if(continuousSession?.loaded){continuousSession.blocks.forEach(b=>{if(b.editor){b.rich=b.editor.blocks();b.body=continuousPlain(b.rich);}});continuousDraft();}if(view==='journal'&&continuousMode&&continuousSession?.loaded&&!query)renderContinuous($('content'));else render();privacyMask();scheduleTaskTextSearch(continuousSession);}
function checkPrivacyInactivity(){if((privacyShown||privacyEditing.size)&&Date.now()-privacyLastActivity>=300000)setPrivacyShown(false);}
for(const event of ['pointerdown','keydown','input'])document.addEventListener(event,()=>{checkPrivacyInactivity();privacyLastActivity=Date.now();},true);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(privacyShown||privacyEditing.size))setPrivacyShown(false);});setInterval(checkPrivacyInactivity,15000);
async function createPrivateNote(){if(!privateTags().length){await togglePrivateTag('privato');if(!privateTags().length)return;}if(busy||view!=='journal'||!continuousSession?.loaded)return;const before=new Set(continuousSession.blocks.map(b=>b.clientId));insertContinuousBlock('note',captureToday());const b=continuousSession.blocks.find(b=>!before.has(b.clientId));if(!b)return;b.tags=privateTags()[0]||'privato';privacyEditing.add(b.clientId);b.dirty=true;continuousDraft();renderContinuous($('content'));queueMicrotask(()=>document.querySelector('[data-client-id="'+b.clientId+'"] .rich-area')?.focus());}
function privacyTagDraft(b){if(privateEntry(b)&&b.dirty)privacyEditing.add(b.clientId);privacyMask();}
async function togglePrivateTag(tag){if(busy)return;busy=true;controls();try{const current=privateTags(),next=current.includes(tag)?current.filter(t=>t!==tag):[...current,tag];const saved=await api('savePrivacySettings',{privateTags:next,version:state.settings?.privacyVersion||''});state.settings={...state.settings,...saved};viewCache.clear();privacyEditing.clear();render();privacyMask();message('Visibilità del tag aggiornata.');}catch(e){message(e.message||String(e),true);}finally{busy=false;controls();}}
function renderPrivateTags(c){const section=node('section','','privacy-tag-settings');section.append(node('h2','Visibilità dei tag'),node('p','Un tag contrassegnato come privato nasconde tutte le note e i task che lo usano. Mostra private li rende visibili temporaneamente.','hint'));const tags=[...new Set([...(state.allTags||[]),...privateTags(),'privato'])].sort();for(const tag of tags){const row=node('div','','privacy-tag-row'),control=button(privateTags().includes(tag)?'Privato':'Pubblico',()=>togglePrivateTag(tag));control.setAttribute('aria-label','Tag privato: '+tag);control.setAttribute('aria-pressed',String(privateTags().includes(tag)));row.append(node('span','#'+tag),control);section.append(row);}section.append(node('p','Le note private tornano nascoste all’apertura, cambiando scheda o dopo 5 minuti di inattività. Il filtro riguarda la schermata dell’app: Sheets e Docs restano accessibili direttamente.','hint'));c.append(section);}
const privacyControls=node('div','','privacy-controls'),privacyToggle=button('Mostra private',()=>setPrivacyShown(!privacyShown)),privateQuick=button('Nuova nota privata',createPrivateNote);privacyToggle.id='privacyToggle';privacyToggle.setAttribute('aria-pressed','false');privateQuick.id='privateQuick';privacyControls.append(privacyToggle,privateQuick);document.querySelector('.brand').after(privacyControls);

function dateLabel(date,long=true){return new Date(date+'T12:00:00Z').toLocaleDateString('it-IT',{timeZone:'Europe/Rome',...(long?{weekday:'long',day:'numeric',month:'long',year:'numeric'}:{day:'numeric',month:'short'})});}
function entryProjects(e){return(e.projects||'').split(',').filter(Boolean);}
function entryTags(e){return(e.tags||'').split(',').filter(Boolean);}
function refreshProjectPicker(hidden){const choices=hidden.parentElement.querySelector('select'),selected=hidden.value.split(',').filter(Boolean);choices.replaceChildren();projects().forEach(p=>{const option=node('option',p.name);option.value=p.slug;option.selected=selected.includes(p.slug);choices.append(option);});}
function syncCaptureProjects(){const old=$('captureProjects');if(!old)return;if(old.type!=='hidden'){const parent=old.parentElement;const field=projectPicker(parent,'Progetti della nuova voce',old.value);field.id='captureProjects';old.remove();}else{const select=old.parentElement.querySelector('select'),current=old.value.split(',');const available=projects();if([...select.options].map(o=>o.value+o.text).join('|')!==available.map(p=>p.slug+p.name).join('|')){select.replaceChildren();available.forEach(p=>{const o=node('option',p.name);o.value=p.slug;o.selected=current.includes(p.slug);select.append(o);});}}}

function projectPicker(parent,label,value=''){const hidden=node('input');hidden.type='hidden';hidden.value=value;const box=node('div',undefined,'project-picker'),caption=node('label',label),choices=node('select');choices.multiple=true;choices.size=3;choices.setAttribute('aria-label',label);const selected=value.split(',').filter(Boolean);projects().forEach(p=>{const o=node('option',p.name);o.value=p.slug;o.selected=selected.includes(p.slug);choices.append(o);});choices.onchange=()=>{hidden.value=[...choices.selectedOptions].map(o=>o.value).join(',');hidden.dispatchEvent(new Event('input',{bubbles:true}));};box.append(caption,choices,hidden,node('p','Seleziona i progetti esistenti (Ctrl per più scelte). Per crearne uno usa la pagina Progetti.','hint'));parent.append(box);return hidden;}

function message(s,error=false){if(error&&!privacyShown){const hidden=[...state.entries,...(window.privacyAllBlocks||[])].filter(e=>privateEntry(e)&&!privacyEditing.has(e.clientId));if(hidden.some(e=>{const title=e.text||e.title||String(e.body||'').split('\n')[0];return title?.length>2&&s.includes(title.slice(0,40));}))s='Operazione non completata. Mostra private per controllare la bozza.';}$('message').textContent=s;$('message').className=error?'error':'';const dialog=document.querySelector('dialog[open]');if(dialog){let notice=dialog.querySelector('.dialog-error');if(!notice){notice=node('p','','form-error dialog-error');notice.setAttribute('role','alert');dialog.prepend(notice);}notice.textContent=error?s:'';notice.hidden=!error;if(error)notice.scrollIntoView({block:'nearest'});}}
async function api(name,arg,traceContext={}){
 const checkpointOptions={affectsSearch:!['saveDayOperation','saveWeekOperation','saveHabitLogOperation'].includes(name)};
 const invalidating=localCacheEnabled&&localRepository&&!/^(get|search|preview|benchmark)/.test(name)?localRepository:null;

 const action=enabled&&activeTraceAction&&['saveJournalPage','saveDay','saveDays','saveDayOperation','saveWeekOperation'].includes(name)?activeTraceAction:null;
 const summary=enabled?{...traceRequestSummary(arg),...traceContext,requestBytes:traceBytes(arg),...(action?{actionId:action.id,batchIndex:++action.started}: {})}:null;

  const finish=(value,error,diagnostics)=>{if(action){if(error)action.failed++;else action.completed++;}if(enabled&&generation===traceGeneration){const metrics={...summary,...diagnostics,traceId,outcome:error?'error':traceResultOutcome(value)};if(error)metrics.errorCategory=traceErrorCategory(error);metrics.responseBytes=traceBytes(value);recordTiming(name,started,value,false,metrics);}if(error)reject(error);else resolve(value);};

}
