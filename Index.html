/* Stile condiviso. Le regole precedenti definiscono soltanto le disposizioni delle viste. */
:root{
 --font-ui:'Segoe UI',system-ui,sans-serif;
 --ink:var(--paint-172032);--muted:var(--paint-788493);--line:var(--paint-e0e5ed);--surface:var(--paint-fff);--sidebar:var(--paint-f5f6f8);
 --accent:var(--paint-f5b42c);--accent-hover:var(--paint-efaa1d);--accent-soft:var(--paint-fff3dc);--link:var(--paint-2679d5);
 --radius:7px;--text:15px;--title:30px;--section:22px;--card-title:18px;--small:13px;
 --space:8px;
 font-family:var(--font-ui);color:var(--ink);font-size:var(--text);background:var(--surface);
}
body{font-family:var(--font-ui);color:var(--ink)}
button,input,select,textarea{font-family:var(--font-ui);font-size:14px;border-color:var(--line);border-radius:var(--radius);color:var(--ink)}
button{padding:9px 13px;line-height:1.35}button:hover{background:var(--accent-soft)}
button.primary,.primary{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:600}
button.primary:hover{background:var(--accent-hover)}
input,select,textarea{background:var(--surface);padding:10px 12px;line-height:1.5}
textarea{font-size:var(--text);min-height:110px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--link);outline-offset:3px}
h1,.journal-view .journal-header h1{font-size:var(--title);font-weight:700;letter-spacing:-.7px;line-height:1.2;margin:0 0 8px}
h2,.journal-view #detail h2,.journal-view .dayhead button,body:has(.habit-actions) #detail h2{font-size:var(--section);font-weight:650;letter-spacing:-.35px;line-height:1.3}
h3,.journal-view .detail-title,.detail-title{font-size:var(--card-title);font-weight:650;line-height:1.4}
label{font-size:14px;font-weight:600;color:var(--ink);margin:16px 0 7px}
#detail form>label,.journal-view #detail form>label,body:has(.habit-actions) #detail label{font-size:var(--card-title);font-weight:600}
p{line-height:1.55}.muted,.hint,.excerpt{color:var(--muted)}.hint,.muted{font-size:var(--small)}

.sidebar,.journal-view .sidebar{background:var(--sidebar);padding:26px 16px;border-color:var(--line)}
.brand,.journal-view .brand{font-size:27px;letter-spacing:-.8px;margin:0 12px 26px}

.workspace,.journal-view .workspace{padding:26px 32px}

.excerpt,.journal-view .excerpt{font-size:14px;line-height:1.55}

async function saveDailyReflections(){

 }

 }
