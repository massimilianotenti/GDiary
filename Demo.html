/* Stile condiviso. Le regole precedenti definiscono soltanto le disposizioni delle viste. */
:root{
 --font-ui:'Segoe UI',system-ui,sans-serif;
 --ink:var(--paint-172032);--muted:var(--paint-788493);--line:var(--paint-e0e5ed);--surface:var(--paint-fff);--sidebar:var(--paint-f5f6f8);
 --accent:var(--paint-f5b42c);--accent-hover:var(--paint-efaa1d);--accent-soft:var(--paint-fff3dc);--link:var(--paint-2679d5);
 --radius:7px;--text:15px;--title:30px;--section:22px;--card-title:18px;--small:13px;
 --space:8px;
 font-family:var(--font-ui);color:var(--ink);font-size:var(--text);background:var(--surface);
}
body{font-family:var(--font-ui);color:var(--ink)}
button,input,select,textarea{font-family:var(--font-ui);font-size:14px;border-color:var(--line);border-radius:var(--radius);color:var(--ink)}
button{padding:9px 13px;line-height:1.35}button:hover{background:var(--accent-soft)}
button.primary,.primary{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:600}
button.primary:hover{background:var(--accent-hover)}
input,select,textarea{background:var(--surface);padding:10px 12px;line-height:1.5}
textarea{font-size:var(--text);min-height:110px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--link);outline-offset:3px}
h1,.journal-view .journal-header h1{font-size:var(--title);font-weight:700;letter-spacing:-.7px;line-height:1.2;margin:0 0 8px}
h2,.journal-view #detail h2,.journal-view .dayhead button,body:has(.habit-actions) #detail h2{font-size:var(--section);font-weight:650;letter-spacing:-.35px;line-height:1.3}
h3,.journal-view .detail-title,.detail-title{font-size:var(--card-title);font-weight:650;line-height:1.4}
label{font-size:14px;font-weight:600;color:var(--ink);margin:16px 0 7px}
#detail form>label,.journal-view #detail form>label,body:has(.habit-actions) #detail label{font-size:var(--card-title);font-weight:600}
p{line-height:1.55}.muted,.hint,.excerpt{color:var(--muted)}.hint,.muted{font-size:var(--small)}

.sidebar,.journal-view .sidebar{background:var(--sidebar);padding:26px 16px;border-color:var(--line)}
.brand,.journal-view .brand{font-size:27px;letter-spacing:-.8px;margin:0 12px 26px}

.workspace,.journal-view .workspace{padding:26px 32px}

.excerpt,.journal-view .excerpt{font-size:14px;line-height:1.55}

function setup() {
  return locked_(function() {
    const db = SpreadsheetApp.getActiveSpreadsheet();
    if (!db) throw new Error('Apri lo script da Estensioni > Apps Script nel tuo Sheet.');
    PropertiesService.getScriptProperties().setProperty('DB_ID', db.getId());
    [['Entries',ENTRY_HEADERS],['Projects',PROJECT_HEADERS],['Files',FILE_HEADERS],['Weeks',WEEK_HEADERS],['Days',DAY_HEADERS],['Goals',GOAL_HEADERS],['Habits',HABIT_HEADERS],['HabitLogs',LOG_HEADERS],['DocRefs',REF_HEADERS],['Registry',REG_HEADERS],['ExportJobs',JOB_HEADERS],['TaskPlans',PLAN_HEADERS]].forEach(function(pair) {
      let sheet = db.getSheetByName(pair[0]);
      if (!sheet) sheet = db.insertSheet(pair[0]);
      if (sheet.getLastRow() === 0) {
        sheet.getRange(1,1,1,pair[1].length).setValues([pair[1]]);
        sheet.setFrozenRows(1);
      }
      // Safe additive migration from the original ten-column MVP.
      if (pair[0] === 'Entries' && sheet.getRange(1,11).getDisplayValues()[0][0] === '') {
        verify_(sheet, ENTRY_HEADERS.slice(0,10));
        sheet.getRange(1,11,1,3).setValues([ENTRY_HEADERS.slice(10,13)]);
        if (sheet.getLastRow()>1) {
          const old=sheet.getRange(2,1,sheet.getLastRow()-1,10).getDisplayValues();
          sheet.getRange(2,11,old.length,3).setNumberFormat('@').setValues(old.map(r=>[r[4]?'project':'personal','','']));
        }
      }
      if(pair[0]==='Entries')ensureEntryTagHeader_(sheet,true);
      if(pair[0]==='Days')ensureDayHeaders_(sheet,true);
      if(pair[0]==='Goals')ensureGoalIconHeader_(sheet,true);
      if(pair[0]==='Habits')ensureHabitHeaders_(sheet,true);
      verify_(sheet,pair[1]);
    });
    return 'Pronto: ' + db.getUrl();
  });
}

function cachedRows_(sheet, headers) {

  // Limite 100KB CacheService: lo usiamo solo per tabelle compatte
  const isCacheable = ['Projects', 'Goals', 'Habits', 'TaskPlans'].includes(sheetName);
  
  if (isCacheable) {
    const cached = cache.get(cacheKey);
    if (cached) {
      try { const data=JSON.parse(cached); if(Array.isArray(data)&&data.every(row=>headers.every(h=>Object.prototype.hasOwnProperty.call(row,h))))return data; } catch (e) {}

  }

function parseJournal_(date, raw,legacyHashProjects=false) {

  const lines = raw.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  if (!lines.length || lines.length>100) throw new Error('Inserisci da 1 a 100 righe.');
  return lines.filter(line=>line!==date).map(function(line) {
    let type = 'note', status = '', due = '';
    if (/^(☐|□|\[ \])\s*/.test(line)) { type='task'; status='open'; line=line.replace(/^(☐|□|\[ \])\s*/,''); }
    else if (/^(☑|\[x\])\s*/i.test(line)) { type='task'; status='done'; line=line.replace(/^(☑|\[x\])\s*/i,''); }
    else if (/^[–-]\s*/.test(line)) { type='idea'; line=line.replace(/^[–-]\s*/,''); }
    else line=line.replace(/^•\s*/,'');

      due=value; return '';

    line=line.replace(/(^|\s)#([\p{L}\p{N}_-]+)/gu,function(_,prefix,tag) { if(legacyHashProjects){const slug=slug_(tag);if(!projects.includes(slug))projects.push(slug);}else tags.push(tag);return prefix; });

    if (!text) throw new Error('Ogni riga deve contenere un testo.');
    return {date,type,text,projects:projects.join(','),tags:normaliseTags_(tags.join(',')),due,status};
  });
}

function newTraceId(){return typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'trace-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);}

function setPrivacyShown(show){privacyShown=show;privacyLastActivity=Date.now();if(!show){privacyEditing.clear();query='';$('search').value='';archiveQuery='';document.querySelectorAll('dialog[open]').forEach(d=>d.close());message('Note private nascoste.');}if(continuousSession?.loaded){continuousSession.blocks.forEach(b=>{if(b.editor){b.rich=b.editor.blocks();b.body=continuousPlain(b.rich);}});continuousDraft();}if(view==='journal'&&continuousMode&&continuousSession?.loaded&&!query)renderContinuous($('content'));else render();privacyMask();}
function checkPrivacyInactivity(){if((privacyShown||privacyEditing.size)&&Date.now()-privacyLastActivity>=300000)setPrivacyShown(false);}

async function createPrivateNote(){if(!privateTags().length){await togglePrivateTag('privato');if(!privateTags().length)return;}if(busy||view!=='journal'||!continuousSession?.loaded)return;const before=new Set(continuousSession.blocks.map(b=>b.clientId));insertContinuousBlock('note',captureToday());const b=continuousSession.blocks.find(b=>!before.has(b.clientId));if(!b)return;b.tags=privateTags()[0]||'privato';privacyEditing.add(b.clientId);b.dirty=true;continuousDraft();renderContinuous($('content'));queueMicrotask(()=>document.querySelector('[data-client-id="'+b.clientId+'"] .rich-area')?.focus());}

function api(name,arg,traceContext={}){

  const finish=(value,error,diagnostics)=>{if(action){if(error)action.failed++;else action.completed++;}if(enabled&&generation===traceGeneration){const metrics={...summary,...diagnostics,traceId,outcome:error?'error':traceResultOutcome(value)};if(error)metrics.errorCategory=traceErrorCategory(error);metrics.responseBytes=traceBytes(value);recordTiming(name,started,value,false,metrics);}if(error)reject(error);else resolve(value);};

}

const dailyDrafts=new Map();

async function saveDailyReflections(){const rows=[...dailyDrafts.values()].filter(b=>b.dirty&&b.date.startsWith(month+'-'));if(!rows.length)return;for(const b of rows){if(b.editor){b.rich=b.editor.blocks();b.body=continuousPlain(b.rich);}if(b.body.length>6000)throw Error(b.title+': massimo 6000 caratteri.');}const days=[...new Set(rows.map(b=>b.date))];busy=true;controls();try{for(const date of days){const dirty=rows.filter(b=>b.date===date),versions=new Set(dirty.map(b=>b.updatedAt));if(versions.size!==1)throw Error('La giornata è cambiata: conserva la bozza e aggiorna.');const payload={date,updatedAt:dirty[0].updatedAt};dirty.forEach(b=>{payload[b.field]=b.body;payload[b.field+'Rich']=b.rich;});const result=await api('saveDay',payload);state.days=result.days||result.commonPatch?.days||state.days;const row=state.days.find(d=>d.date===date);dirty.forEach(b=>{b.updatedAt=row.updatedAt;b.dirty=false;b.savedSnapshot=dailyKey(b);draftRemove('daily:'+b.date+':'+b.field);});dailyDrafts.forEach(b=>{if(b.date===date&&!b.dirty)b.updatedAt=row.updatedAt;});}viewCache.clear();}finally{busy=false;controls();}dirtyMain=!!continuousSession?.blocks.some(b=>b.dirty)||[...dailyDrafts.values()].some(b=>b.dirty&&b.date.startsWith(month+'-'));renderContinuous($('content'));message(dirtyMain?'Resta una bozza da salvare.':'Pagina e riflessioni salvate.');}
